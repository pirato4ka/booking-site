<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Атмосфера студии «Адам и Ева»</title>
  <desc id="heroDesc">Тёплая композиция с уходовыми средствами, свечой и сухоцветами в арочной нише.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8efe5"/>
      <stop offset="1" stop-color="#ead7c3"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d1bb"/>
      <stop offset="1" stop-color="#d5b394"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b77b52"/>
      <stop offset=".55" stop-color="#9a5d3a"/>
      <stop offset="1" stop-color="#7c452c"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e1b28b" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e1b28b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6d4a32" flood-opacity=".18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

